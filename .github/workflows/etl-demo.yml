name: ETL demonstrativo

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  executar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: python -m pip install -r requirements.txt

      - run: python src/etl_iam.py

      - uses: actions/upload-artifact@v4
        with:
          name: consolidado-iam-demo
          path: dados/saida/consolidado_iam_demo.xlsx
          if-no-files-found: error
