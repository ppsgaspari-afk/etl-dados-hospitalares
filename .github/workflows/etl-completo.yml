name: ETL completo
on:
  workflow_dispatch:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validar-e-executar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Testes automatizados
        run: python -m unittest discover -s tests -v
      - run: python src/etl_iam.py
      - run: python src/etl_avc.py
      - run: python src/etl_medicamentos.py
      - uses: actions/upload-artifact@v4
        with:
          name: resultados-etl
          path: dados/saida/*.xlsx
          if-no-files-found: error
